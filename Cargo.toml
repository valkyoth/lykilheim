[package]
name = "lykilheim"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "EUPL-1.2"
description = "Rust-native, API-driven secrets manager foundation."
repository = "https://github.com/valkyoth/lykilheim"
readme = "README.md"
keywords = ["secrets", "vault", "security", "rust"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "1.1.2"
tower-http = { version = "0.6.11", features = ["limit", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
zeroize = { version = "1.8.2", features = ["alloc"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
panic = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
