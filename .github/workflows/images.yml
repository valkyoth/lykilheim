name: Container Images

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: OCI platforms to build.
        required: true
        default: linux/amd64

permissions:
  contents: read

jobs:
  images:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check image readiness
        run: |
          set -eu
          if [ ! -f containers/Containerfile.wolfi ]; then
            echo "containers/Containerfile.wolfi is not scaffolded yet; image publishing starts in the 0.2.x plan."
            exit 0
          fi
          echo "Containerfile exists; wire build-push-action before publishing release images."
